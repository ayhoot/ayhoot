<!DOCTYPE html>
<html>
<head>
    <title>Live Session Debug</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Monaco', 'Menlo', monospace; background: #1e1e1e; color: #d4d4d4; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        h1 { color: #4ec9b0; margin: 20px 0 10px 0; font-size: 18px; }
        h2 { color: #569cd6; margin: 15px 0 8px 0; font-size: 16px; }
        .section { background: #2d2d2d; padding: 15px; margin: 10px 0; border-left: 3px solid #007acc; }
        .status { padding: 10px; margin: 5px 0; border-radius: 4px; }
        .ok { background: #164b35; color: #4ade80; }
        .error { background: #3c2a2a; color: #f87171; }
        .info { background: #1e3a8a; color: #60a5fa; }
        code { background: #1e1e1e; padding: 2px 6px; border-radius: 3px; color: #ce9178; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        button { background: #007acc; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; margin: 5px 5px 5px 0; }
        button:hover { background: #0098ff; }
        .log { background: #1e1e1e; padding: 10px; margin: 10px 0; border-radius: 4px; max-height: 300px; overflow-y: auto; white-space: pre-wrap; word-wrap: break-word; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Live Session - Debug Console</h1>
        
        <div class="grid">
            <div>
                <div class="section">
                    <h2>Teacher Dashboard</h2>
                    <button onclick="testTeacherButtons()">Test Buttons Click</button>
                    <button onclick="testTeacherAPI()">Test Navigation API</button>
                    <button onclick="checkTeacherState()">Check State</button>
                </div>
            </div>
            
            <div>
                <div class="section">
                    <h2>Student Session</h2>
                    <button onclick="testStudentAnswer()">Test Submit Answer</button>
                    <button onclick="testStudentSocket()">Test Socket</button>
                    <button onclick="checkStudentState()">Check State</button>
                </div>
            </div>
        </div>

        <div class="section">
            <h2>Connection Status</h2>
            <div id="status"></div>
        </div>

        <div class="section">
            <h2>Debug Log</h2>
            <div class="log" id="log"></div>
        </div>

        <div class="section">
            <h2>Quick Links</h2>
            <a href="http://localhost:5173/hostlive/41" target="_blank"><button>👨‍🏫 Teacher Dashboard</button></a>
            <a href="http://localhost:5173/student/exam/2/game/play?live_pin=150562" target="_blank"><button>👨‍🎓 Student Session</button></a>
        </div>
    </div>

    <script>
        const logs = [];

        function log(msg, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const entry = `[${timestamp}] ${msg}`;
            logs.push(entry);
            console.log(entry);
            updateLog();
        }

        function updateLog() {
            const logDiv = document.getElementById('log');
            logDiv.textContent = logs.slice(-30).join('\n'); // Show last 30 logs
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function checkStatus() {
            const status = document.getElementById('status');
            status.innerHTML = '';
            
            // Check services
            const checks = [
                { name: 'Laravel API', url: 'http://localhost:8000/api/live-session/id/41', expected: 200 },
                { name: 'WebSocket', url: 'http://localhost:6001/status', expected: 200 },
                { name: 'Vite Dev', url: 'http://localhost:5173/', expected: 200 }
            ];

            for (const check of checks) {
                try {
                    const resp = await fetch(check.url);
                    const div = document.createElement('div');
                    div.className = `status ${resp.status === check.expected ? 'ok' : 'error'}`;
                    div.textContent = `${check.name}: ${resp.ok ? '✓' : '✗'} (${resp.status})`;
                    status.appendChild(div);
                } catch (e) {
                    const div = document.createElement('div');
                    div.className = 'status error';
                    div.textContent = `${check.name}: ✗ (Connection failed)`;
                    status.appendChild(div);
                }
            }
        }

        function testTeacherButtons() {
            log('Testing teacher buttons click', 'info');
            log('1. Open browser DevTools (F12) on teacher dashboard', 'info');
            log('2. Go to console tab', 'info');
            log('3. Run: document.querySelector("button:contains(Next)").click()', 'info');
            log('4. Check if nextQuestion() method is called', 'info');
        }

        async function testTeacherAPI() {
            log('Testing teacher navigation API...', 'info');
            const token = localStorage.getItem('token');
            
            if (!token) {
                log('ERROR: No token found in localStorage', 'error');
                return;
            }

            try {
                const resp = await fetch('http://localhost:8000/api/live-session/41/next-question', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({})
                });

                log(`Teacher API Response: ${resp.status}`, resp.ok ? 'ok' : 'error');
                if (resp.ok) {
                    const data = await resp.json();
                    log(`Question Index: ${data.session?.current_question_index}`, 'ok');
                } else {
                    const error = await resp.json();
                    log(`Error: ${error.message}`, 'error');
                }
            } catch (e) {
                log(`Exception: ${e.message}`, 'error');
            }
        }

        async function testStudentAnswer() {
            log('Testing student answer submission...', 'info');
            const token = localStorage.getItem('token');
            
            if (!token) {
                log('ERROR: No token found', 'error');
                return;
            }

            try {
                const payload = {
                    exam_id: 2,
                    question_id: 1,
                    selected_option_id: 1,
                    time_spent: 5
                };

                const resp = await fetch('http://localhost:8000/api/live-session/41/submit-answer?live_pin=150562', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify(payload)
                });

                log(`Student Answer API Response: ${resp.status}`, resp.ok ? 'ok' : 'error');
                if (resp.ok) {
                    const data = await resp.json();
                    log(`Answer submitted successfully`, 'ok');
                } else {
                    const error = await resp.json();
                    log(`Error: ${error.message || 'Unknown error'}`, 'error');
                }
            } catch (e) {
                log(`Exception: ${e.message}`, 'error');
            }
        }

        function testStudentSocket() {
            log('Testing student socket connection...', 'info');
            log('1. Check browser console for WebSocket connection logs', 'info');
            log('2. Look for: [SOCKET-STUDENT] Connection established', 'info');
            log('3. Look for: [SOCKET-STUDENT] Received question.next event', 'info');
        }

        function checkTeacherState() {
            log('Checking teacher state...', 'info');
            log('1. Open teacher dashboard: http://localhost:5173/hostlive/41', 'info');
            log('2. Open DevTools (F12 → Console)', 'info');
            log('3. Run: vm.$data (to see all component data)', 'info');
            log('4. Check: session.status should be "question"', 'info');
            log('5. Check: session.current_question_index', 'info');
            log('6. Check: autoAdvance should be true/false', 'info');
        }

        function checkStudentState() {
            log('Checking student state...', 'info');
            log('1. Open student dashboard', 'info');
            log('2. Open DevTools (F12 → Console)', 'info');
            log('3. Run: vm.$data (to see all component data)', 'info');
            log('4. Check: isLiveSession should be true', 'info');
            log('5. Check: livePin should be "150562"', 'info');
            log('6. Check: currentIndex, selectedOption', 'info');
        }

        // Initialize
        checkStatus();
        log('Debug console ready!', 'ok');
    </script>
</body>
</html>
